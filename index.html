
<!-- CHECKOUT PAGE -->
<main id="checkoutPage" class="page hidden">
  <button class="back" onclick="openCart()">← Back to Cart</button>
  <h1>Checkout</h1>

  <div class="checkout-layout">
    <form id="checkoutForm">
      <h2>Contact Information</h2>
      <label>Email</label>
      <input type="email" id="email" required placeholder="Email address">

      <h2>Shipping Address</h2>
      <label>Full Name</label>
      <input id="shippingName" required>

      <label>Address</label>
      <input id="address" required>

      <label>City</label>
      <input id="city" required>

      <label>State</label>
      <input id="state" required>

      <label>ZIP Code</label>
      <input id="zip" required>

      <h2>Payment</h2>
      <label for="demoCard">Credit Card Number (Demo)</label>
      <div class="card-bar">
        <span class="card-icon">💳</span>
        <input
          type="text"
          id="demoCard"
          placeholder="0000 0000 0000 0000"
          maxlength="19"
          autocomplete="off"
          inputmode="numeric"
        >
      </div>

      <button type="submit" class="primary full">Place Order</button>

      <p class="checkout-fineprint">
        🔒 This is a mock checkout. No real payment will be processed.
      </p>
    </form>

    <div class="checkout-summary">
      <h2>Order Summary</h2>
      <div id="checkoutItems"></div>
      <h2 id="checkoutTotal"></h2>
    </div>
  </div>
</main>
